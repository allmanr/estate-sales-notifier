name: Keep Scheduled Workflows Active

on:
  schedule:
    - cron: '0 14 1 * *'  # Monthly repo activity prevents scheduled workflow inactivity disablement.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create activity when repository is quiet
        run: |
          set -euo pipefail

          last_commit_ts="$(git log -1 --format=%ct)"
          now_ts="$(date +%s)"
          age_days="$(((now_ts - last_commit_ts) / 86400))"

          echo "Last commit was ${age_days} days ago."

          if [ "${age_days}" -lt 30 ]; then
            echo "Repository is active enough; no keepalive commit needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Keep scheduled workflows active"
          git push
