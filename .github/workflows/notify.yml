name: Estate Sales Notifier

on:
  schedule:
    - cron: '0 3 * * 4'  # 03:00 UTC Thursday (9 PM Wednesday CST / 10 PM Wednesday CDT; GitHub Actions uses UTC and does not adjust for DST)
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run estate sales notifier
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: python estate_sales_notifier.py
